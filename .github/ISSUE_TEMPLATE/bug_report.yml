name: Bug report
description: Report a reproducible problem in the downloader
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach downloaded documents, cookies, credentials, or private paths.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      options: [ndrc, mee, mnr, mof, all or shared pipeline]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized output
      description: Remove usernames, local absolute paths, proxy credentials, and document contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal paths, and downloaded content.
          required: true

